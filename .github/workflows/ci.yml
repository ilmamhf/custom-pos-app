name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint-free typecheck, unit, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-nestjs
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pos:pos@localhost:5432/pos?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api-nestjs/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run prisma:seed
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run test:e2e

  react:
    name: React Admin (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-react
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin-react/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  flutter:
    name: Flutter POS (analyze, test, web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test
      - run: flutter build web --dart-define=API_BASE_URL=http://localhost:3000/api/v1

  dependency-audit:
    name: Dependency audit (blocking)
    runs-on: ubuntu-latest
    # Blocking since D-01/D-02: the API and React production dependency trees
    # are free of advisories, so any new one must fail the pipeline.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: API production dependencies
        working-directory: apps/api-nestjs
        run: npm audit --omit=dev
      - name: React production dependencies
        working-directory: apps/admin-react
        run: npm audit --omit=dev

  containers:
    name: Container images (build + smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pos:pos@localhost:5432/pos?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      CORS_ORIGIN: https://admin.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api-nestjs
          file: apps/api-nestjs/Dockerfile
          push: false
          load: true
          tags: pos-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Admin image
        uses: docker/build-push-action@v6
        with:
          context: apps/admin-react
          file: apps/admin-react/Dockerfile
          push: false
          load: true
          tags: pos-admin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Apply migrations with the API image
        run: docker run --rm --network host -e DATABASE_URL pos-api:ci npx prisma migrate deploy
      - name: Start the API and wait for readiness
        run: |
          docker run -d --name pos-api-ci --network host \
            -e DATABASE_URL -e JWT_ACCESS_SECRET -e JWT_REFRESH_SECRET -e CORS_ORIGIN \
            -e NODE_ENV=production pos-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker logs pos-api-ci
          exit 1
      - name: Start the Admin and check the SPA and the API proxy
        run: |
          # `api` must resolve inside the container: the shared nginx config
          # proxies /api/ to http://api:3000.
          docker run -d --name pos-admin-ci --network host --add-host api:127.0.0.1 pos-admin:ci
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/api/v1/health
      - name: Check the Prometheus scrape endpoint
        run: |
          curl -fsS http://127.0.0.1:3000/metrics | grep -q 'pos_http_requests_total'
          curl -fsS http://127.0.0.1:3000/metrics | grep -q 'pos_readiness_up 1'
          # The scrape endpoint stays outside the versioned prefix.
          if curl -fsS http://127.0.0.1:3000/api/v1/metrics 2>/dev/null; then
            echo "the metrics endpoint must not be exposed under /api/v1"
            exit 1
          fi
      - name: Container logs
        if: always()
        run: docker logs pos-api-ci; docker logs pos-admin-ci

  backup:
    name: Backups (encrypted backup + restore drill)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backup image
        run: docker build -t pos-backup:ci -f deploy/backup/Dockerfile deploy/backup
      - name: Generate the age keypair
        run: |
          # The committed recipient is overwritten on purpose: CI proves the
          # whole flow with a keypair it generates itself.
          #
          # The script runs from the copy baked into the image, not from the
          # mounted directory: a mount must never shadow the tooling. The
          # mounted directory only receives the generated keys.
          # Run as root (via --entrypoint sh) so the mounted /keys volume is writable.
          docker run --rm --entrypoint sh pos-backup:ci \
            -c 'test -x /usr/local/bin/age-keygen.sh'
          docker run --rm --entrypoint sh \
            -e RECIPIENT_FILE=/keys/age-recipient.txt \
            -e IDENTITY_FILE=/keys/age-identity.txt \
            -v "$PWD/deploy/backup:/keys" \
            pos-backup:ci /usr/local/bin/age-keygen.sh
          grep -q '^age1' deploy/backup/age-recipient.txt
          test -s deploy/backup/age-identity.txt
      - name: Start PostgreSQL with the WAL archiving
        run: |
          docker volume create pos-ci-wal
          docker volume create pos-ci-backups
          docker volume create pos-ci-textfile
          # Pre-create the textfile collector directory with correct ownership (postgres UID 999)
          docker run --rm -v pos-ci-textfile:/data alpine sh -c "mkdir -p /data && chown -R 999:999 /data"
          docker run -d --name pos-pg-ci --network host \
            -e POSTGRES_USER=pos -e POSTGRES_PASSWORD=pos -e POSTGRES_DB=pos \
            -e BACKUP_AGE_RECIPIENT_FILE=/etc/backup/age-recipient.txt \
            -v pos-ci-wal:/wal-archive \
            -v "$PWD/deploy/backup/age-recipient.txt:/etc/backup/age-recipient.txt:ro" \
            -v "$PWD/deploy/backup/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro" \
            pos-backup:ci postgres \
              -c archive_mode=on \
              -c 'archive_command=/usr/local/bin/archive-wal.sh "%p" "%f"' \
              -c archive_timeout=300 \
              -c hba_file=/etc/postgresql/pg_hba.conf
          for attempt in $(seq 1 30); do
            if docker exec pos-pg-ci pg_isready -U pos -d pos; then
              exit 0
            fi
            sleep 2
          done
          docker logs pos-pg-ci
          exit 1
      - name: Build the API image and apply the migrations
        uses: docker/build-push-action@v6
        with:
          context: apps/api-nestjs
          file: apps/api-nestjs/Dockerfile
          push: false
          load: true
          tags: pos-api:ci
      - name: Apply the migrations and seed the database
        run: |
          export DATABASE_URL='postgresql://pos:pos@127.0.0.1:5432/pos?schema=public'
          docker run --rm --network host -e DATABASE_URL pos-api:ci npx prisma migrate deploy
          docker run --rm --network host -e DATABASE_URL pos-api:ci npm run prisma:seed
      - name: Take the encrypted backup
        run: |
          docker run --rm --network host \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER=pos -e PGPASSWORD=pos -e PGDATABASE=pos \
            -e BACKUP_AGE_RECIPIENT_FILE=/etc/backup/age-recipient.txt \
            -e PROMETHEUS_TEXTFILE_DIR=/var/lib/node_exporter/textfile_collector \
            -v pos-ci-backups:/backups \
            -v pos-ci-wal:/wal-archive \
            -v pos-ci-textfile:/var/lib/node_exporter/textfile_collector \
            -v "$PWD/deploy/backup/age-recipient.txt:/etc/backup/age-recipient.txt:ro" \
            --entrypoint /usr/local/bin/pos-entrypoint.sh \
            pos-backup:ci /usr/local/bin/backup.sh
      - name: Check that the backup is encrypted and complete
        run: |
          # Pre-drill contract: the backup timestamp must exist, the drill
          # metric must NOT be expected yet.
          docker run --rm \
            -e PROMETHEUS_TEXTFILE_DIR=/var/lib/node_exporter/textfile_collector \
            -e VERIFY_EXPECT_DRILL=false \
            -v pos-ci-backups:/backups \
            -v pos-ci-textfile:/var/lib/node_exporter/textfile_collector \
            --entrypoint /usr/local/bin/pos-entrypoint.sh \
            pos-backup:ci /usr/local/bin/verify-backup.sh
      - name: Run the restore drill
        run: |
          docker volume create pos-ci-drill
          # Copy age-identity.txt to a temp location we own using sudo (original is
          # root-owned from age-keygen container), make it world-readable, and mount that.
          mkdir -p /tmp/backup-keys
          sudo cp "$PWD/deploy/backup/age-identity.txt" /tmp/backup-keys/
          chmod 644 /tmp/backup-keys/age-identity.txt
          # Run as root (via --entrypoint sh) and invoke restore-drill.sh directly
          # (like age-keygen) to avoid pos-entrypoint.sh dropping privileges.
          docker run --rm --network host --entrypoint sh \
            -e PGUSER=pos -e PGPASSWORD=pos -e PGDATABASE=pos \
            -e BACKUP_AGE_IDENTITY=/keys/age-identity.txt \
            -e DRILL_PORT=55432 \
            -e DRILL_REPORT_DIR=/drill \
            -e PROMETHEUS_TEXTFILE_DIR=/var/lib/node_exporter/textfile_collector \
            -v pos-ci-backups:/backups \
            -v pos-ci-wal:/wal-archive \
            -v pos-ci-textfile:/var/lib/node_exporter/textfile_collector \
            -v pos-ci-drill:/drill \
            -v /tmp/backup-keys:/keys:ro \
            pos-backup:ci /usr/local/bin/restore-drill.sh
      - name: Check the drill report
        run: |
          # Post-drill contract: the drill metric and the drill report must
          # exist. The metric directory and the report volume are mounted
          # because this container is not the one that ran the drill.
          docker run --rm \
            -e PROMETHEUS_TEXTFILE_DIR=/var/lib/node_exporter/textfile_collector \
            -e VERIFY_EXPECT_DRILL=true \
            -e DRILL_REPORT_DIR=/drill \
            -v pos-ci-backups:/backups \
            -v pos-ci-textfile:/var/lib/node_exporter/textfile_collector \
            -v pos-ci-drill:/drill \
            --entrypoint /usr/local/bin/pos-entrypoint.sh \
            pos-backup:ci /usr/local/bin/verify-backup.sh
      - name: Container logs
        if: always()
        run: docker logs pos-pg-ci

  monitoring:
    name: Monitoring (Prometheus config + alert rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Prometheus configuration
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/monitoring/prometheus-rules.yaml:/etc/prometheus/rules/prometheus-rules.yaml:ro" \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
      - name: Run the alert rule unit tests
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            test rules /etc/prometheus/prometheus-rules.test.yaml
      - name: Validate the Kubernetes manifests
        run: |
          pip install --quiet pyyaml
          python .github/scripts/validate-k8s.py
