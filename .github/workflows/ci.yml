name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint-free typecheck, unit, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-nestjs
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pos:pos@localhost:5432/pos?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api-nestjs/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run prisma:seed
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run test:e2e

  react:
    name: React Admin (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-react
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin-react/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  flutter:
    name: Flutter POS (analyze, test, web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test
      - run: flutter build web --dart-define=API_BASE_URL=http://localhost:3000/api/v1

  dependency-audit:
    name: Dependency audit (blocking)
    runs-on: ubuntu-latest
    # Blocking since D-01/D-02: the API and React production dependency trees
    # are free of advisories, so any new one must fail the pipeline.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: API production dependencies
        working-directory: apps/api-nestjs
        run: npm audit --omit=dev
      - name: React production dependencies
        working-directory: apps/admin-react
        run: npm audit --omit=dev
