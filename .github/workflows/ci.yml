name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint-free typecheck, unit, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-nestjs
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pos:pos@localhost:5432/pos?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api-nestjs/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run prisma:seed
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run test:e2e

  react:
    name: React Admin (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-react
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin-react/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  flutter:
    name: Flutter POS (analyze, test, web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test
      - run: flutter build web --dart-define=API_BASE_URL=http://localhost:3000/api/v1

  dependency-audit:
    name: Dependency audit (blocking)
    runs-on: ubuntu-latest
    # Blocking since D-01/D-02: the API and React production dependency trees
    # are free of advisories, so any new one must fail the pipeline.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: API production dependencies
        working-directory: apps/api-nestjs
        run: npm audit --omit=dev
      - name: React production dependencies
        working-directory: apps/admin-react
        run: npm audit --omit=dev

  containers:
    name: Container images (build + smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pos:pos@localhost:5432/pos?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      CORS_ORIGIN: https://admin.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api-nestjs
          file: apps/api-nestjs/Dockerfile
          push: false
          load: true
          tags: pos-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Admin image
        uses: docker/build-push-action@v6
        with:
          context: apps/admin-react
          file: apps/admin-react/Dockerfile
          push: false
          load: true
          tags: pos-admin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Apply migrations with the API image
        run: docker run --rm --network host -e DATABASE_URL pos-api:ci npx prisma migrate deploy
      - name: Start the API and wait for readiness
        run: |
          docker run -d --name pos-api-ci --network host \
            -e DATABASE_URL -e JWT_ACCESS_SECRET -e JWT_REFRESH_SECRET -e CORS_ORIGIN \
            -e NODE_ENV=production pos-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker logs pos-api-ci
          exit 1
      - name: Start the Admin and check the SPA and the API proxy
        run: |
          # `api` must resolve inside the container: the shared nginx config
          # proxies /api/ to http://api:3000.
          docker run -d --name pos-admin-ci --network host --add-host api:127.0.0.1 pos-admin:ci
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/api/v1/health
      - name: Check the Prometheus scrape endpoint
        run: |
          curl -fsS http://127.0.0.1:3000/metrics | grep -q 'pos_http_requests_total'
          curl -fsS http://127.0.0.1:3000/metrics | grep -q 'pos_readiness_up 1'
          # The scrape endpoint stays outside the versioned prefix.
          if curl -fsS http://127.0.0.1:3000/api/v1/metrics 2>/dev/null; then
            echo "the metrics endpoint must not be exposed under /api/v1"
            exit 1
          fi
      - name: Container logs
        if: always()
        run: docker logs pos-api-ci; docker logs pos-admin-ci

  monitoring:
    name: Monitoring (Prometheus config + alert rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Prometheus configuration
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/monitoring/prometheus-rules.yaml:/etc/prometheus/rules/prometheus-rules.yaml:ro" \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
      - name: Run the alert rule unit tests
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            test rules /etc/prometheus/prometheus-rules.test.yaml
      - name: Validate the Kubernetes manifests
        run: |
          pip install --quiet pyyaml
          python .github/scripts/validate-k8s.py
