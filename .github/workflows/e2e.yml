name: E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-e2e:
    name: React Admin (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://pos:pos@localhost:5432/pos_e2e?schema=public
      API_BASE_URL: http://localhost:3100/api/v1
      AUTH_LOGIN_THROTTLE_LIMIT: '50'
      AUTH_LOGIN_THROTTLE_TTL_MS: '60000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/api-nestjs/package-lock.json
            apps/admin-react/package-lock.json
            e2e/package-lock.json
      - name: Install API
        working-directory: apps/api-nestjs
        run: npm ci
      - name: Generate Prisma client
        working-directory: apps/api-nestjs
        run: npx prisma generate
      - name: Install React Admin
        working-directory: apps/admin-react
        run: npm ci
      - name: Install e2e harness
        working-directory: e2e
        run: npm ci --include=dev
      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run Admin E2E
        working-directory: e2e
        run: npm test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Upload Playwright videos and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results
          retention-days: 7

  pos-e2e:
    name: Flutter POS (legacy flutter drive)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://pos:pos@localhost:5432/pos_e2e?schema=public
      DATABASE_URL: postgresql://pos:pos@localhost:5432/pos_e2e?schema=public
      NODE_ENV: test
      PORT: '3100'
      JWT_ACCESS_SECRET: e2e-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: e2e-refresh-secret-at-least-32-characters-long
      CORS_ORIGIN: '*'
      SWAGGER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/api-nestjs/package-lock.json
            e2e/package-lock.json
      - name: Install API
        working-directory: apps/api-nestjs
        run: npm ci
      - name: Generate Prisma client
        working-directory: apps/api-nestjs
        run: npx prisma generate
      - name: Install e2e DB helper
        working-directory: e2e
        run: npm ci --include=dev
      - name: Reset and seed e2e database
        working-directory: e2e
        run: node scripts/setup-db.mjs
      - name: Build API
        working-directory: apps/api-nestjs
        run: npm run build
      - name: Start API
        working-directory: apps/api-nestjs
        run: |
          nohup node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3100/api/v1/health > /dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          cat api.log
          exit 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: nanasess/setup-chromedriver@v2
      - name: Start chromedriver
        run: |
          chromedriver --port=4444 > chromedriver.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4444/status > /dev/null; then
              echo "chromedriver ready"
              exit 0
            fi
            sleep 1
          done
          echo "chromedriver failed to start"
          cat chromedriver.log
          exit 1
      - name: Flutter pub get
        working-directory: apps/pos-flutter
        run: flutter pub get
      - name: Run POS integration test
        working-directory: apps/pos-flutter
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/pos_critical_flow_test.dart \
            -d chrome --headless --browser-name=chrome --web-port=7357 \
            --dart-define=API_BASE_URL=http://localhost:3100/api/v1
      - name: Upload API log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: apps/api-nestjs/api.log
          retention-days: 7

  pos-patrol:
    name: Flutter POS (Patrol web)
    # Patrol's bundled Playwright does not support ubuntu-latest (26.04 yet).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://pos:pos@localhost:5432/pos_e2e?schema=public
      DATABASE_URL: postgresql://pos:pos@localhost:5432/pos_e2e?schema=public
      NODE_ENV: test
      PORT: '3100'
      JWT_ACCESS_SECRET: e2e-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: e2e-refresh-secret-at-least-32-characters-long
      CORS_ORIGIN: '*'
      SWAGGER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/api-nestjs/package-lock.json
            e2e/package-lock.json
      - name: Install API
        working-directory: apps/api-nestjs
        run: npm ci
      - name: Generate Prisma client
        working-directory: apps/api-nestjs
        run: npx prisma generate
      - name: Install e2e DB helper
        working-directory: e2e
        run: npm ci --include=dev
      - name: Reset and seed e2e database
        working-directory: e2e
        run: node scripts/setup-db.mjs
      - name: Build API
        working-directory: apps/api-nestjs
        run: npm run build
      - name: Start API
        working-directory: apps/api-nestjs
        run: |
          # Check port availability first
          if ss -tlnp | grep ':3100 '; then
            echo "Port 3100 already in use"
            ss -tlnp | grep ':3100 '
            exit 1
          fi
          # Verify critical dependencies are bundled
          node -e "require('@nestjs/throttler'); require('@prisma/client'); require('@prisma/adapter-pg'); console.log('Critical deps OK')"
          nohup node dist/main.js > api.log 2>&1 &
          API_PID=$!
          for i in $(seq 1 120); do
            if curl -sf http://localhost:3100/api/v1/health > /dev/null; then
              echo "API ready"
              exit 0
            fi
            if ! kill -0 $API_PID 2>/dev/null; then
              echo "API process died unexpectedly"
              cat api.log
              exit 1
            fi
            sleep 1
          done
          echo "API failed to start after 120s"
          cat api.log
          exit 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Patrol CLI
        run: |
          flutter pub global activate patrol_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Flutter pub get
        working-directory: apps/pos-flutter
        run: flutter pub get
      - name: Install Chromium system dependencies for Playwright
        run: sudo npx --yes playwright install-deps chromium
      - name: Patrol doctor
        working-directory: apps/pos-flutter
        run: patrol doctor
      - name: Run Patrol web test
        working-directory: apps/pos-flutter
        run: |
          patrol test \
            --device chrome \
            --web-headless \
            --web-video=on \
            --web-workers=1 \
            --dart-define=API_BASE_URL=http://localhost:3100/api/v1
      - name: Export Patrol videos
        if: always()
        working-directory: apps/pos-flutter
        run: node scripts/export-patrol-videos.mjs
      - name: Upload Patrol report and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-report
          path: |
            apps/pos-flutter/playwright-report
            apps/pos-flutter/patrol_videos
          retention-days: 7
      - name: Upload API log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-api-log
          path: apps/api-nestjs/api.log
          retention-days: 7
