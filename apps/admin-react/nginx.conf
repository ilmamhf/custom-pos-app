# The unprivileged nginx image runs as UID 101 and cannot bind port 80, so the
# server listens on 8080. The container port is mapped to the host port in
# compose.yaml and to the Service/Ingress in deploy/k8s.
map $http_x_forwarded_proto $pos_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA is served from the same origin as the API in the default
    # deployment, so cookies stay first-party and SameSite=Strict holds.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the scheme seen by the outermost proxy (TLS terminator)
        # instead of downgrading it to the internal hop.
        proxy_set_header X-Forwarded-Proto $pos_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html must never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
