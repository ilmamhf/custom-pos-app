name: pos_flutter
description: Flutter POS Cashier App for 1–3 store retail POS system
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  dio: ^5.4.3+1
  drift: ^2.18.0
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.17
  path: ^1.9.0
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.0
  uuid: ^4.4.0
  intl: ^0.19.0
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mocktail: ^1.0.3
  patrol: ^4.11.0
  patrol_finders: ^3.7.0

flutter:
  uses-material-design: true

patrol:
  app_name: Retail POS
  test_directory: patrol_test