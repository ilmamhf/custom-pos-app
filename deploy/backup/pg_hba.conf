# The client authentication rules of the PostgreSQL container.
#
# This file replaces the one initdb writes, because the backup job needs a
# replication connection that the default rules do not cover: the default
# rules only allow replication from localhost, and the backup job runs in
# its own container on the Compose network.
#
# The file is mounted read-only at /etc/postgresql/pg_hba.conf and selected
# with `hba_file` in the server command.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# The healthcheck and the tools inside the container connect through the
# local socket. The socket is only reachable from inside the container.
local   all             all                                     trust

# The backup job opens a physical replication connection. It authenticates
# with the password of the `pos` role, which has the REPLICATION attribute
# because it is the superuser of this instance.
#
# Narrow this to the address of the backup runner in a real deployment.
host    replication     pos             all                     scram-sha-256

# The application and the backup job connect over the container network.
host    all             all             all                     scram-sha-256
