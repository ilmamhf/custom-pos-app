apiVersion: v1
kind: ConfigMap
metadata:
  name: pos-config
  namespace: pos
data:
  NODE_ENV: "production"
  PORT: "3000"
  # Explicit allowlist - the API refuses "*" in production.
  CORS_ORIGIN: "https://admin.example.com"
  SWAGGER_ENABLED: "false"
  # The ingress terminates TLS, so the API must trust the forwarded headers.
  TRUST_PROXY: "true"
  COOKIE_SECURE: "true"
  JWT_ACCESS_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  OFFLINE_GRANT_TTL: "12h"
  AUTH_LOGIN_THROTTLE_LIMIT: "5"
  AUTH_PIN_THROTTLE_LIMIT: "5"
  AUTH_REFRESH_THROTTLE_LIMIT: "20"
  THROTTLE_GLOBAL_LIMIT: "120"
  AUTH_LOCKOUT_THRESHOLD: "5"
  AUTH_LOCKOUT_DURATION_MS: "900000"
  AUTH_LOCKOUT_MAX_DURATION_MS: "3600000"
