# TEMPLATE ONLY - do not commit a filled-in copy.
#
# Copy this file to secret.yaml, replace every value, apply it, and keep the
# filled file out of version control. In a real cluster prefer an external
# secret manager (External Secrets Operator, Vault, AWS Secrets Manager, ...)
# and reference the resulting Secret instead of this file.
apiVersion: v1
kind: Secret
metadata:
  name: pos-secrets
  namespace: pos
type: Opaque
stringData:
  # Connection string for the managed PostgreSQL instance.
  DATABASE_URL: "postgresql://pos:CHANGE_ME@postgres.pos.svc.cluster.local:5432/pos?schema=public"
  # The credentials of the role the backup job connects with. The role
  # needs the REPLICATION attribute: a base backup is a physical copy.
  POSTGRES_USER: "pos"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "pos"
  # At least 32 characters each; generate with:
  #   openssl rand -base64 48
  JWT_ACCESS_SECRET: "CHANGE_ME_AT_LEAST_32_CHARACTERS_LONG"
  JWT_REFRESH_SECRET: "CHANGE_ME_AT_LEAST_32_CHARACTERS_LONG"
  # Optional webhook that receives AUTH_LOCKOUT_ALERT payloads.
  # AUTH_ALERT_WEBHOOK_URL: "https://alerts.example.com/pos-auth"
