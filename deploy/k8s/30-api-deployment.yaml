apiVersion: apps/v1
kind: Deployment
metadata:
  name: pos-api
  namespace: pos
  labels:
    app.kubernetes.io/name: pos-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: pos
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pos-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pos-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: pos
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/example/pos-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pos-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pos-secrets
                  key: DATABASE_URL
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: pos-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: pos-secrets
                  key: JWT_REFRESH_SECRET
            # Optional: only present when the secret defines it.
            - name: AUTH_ALERT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: pos-secrets
                  key: AUTH_ALERT_WEBHOOK_URL
                  optional: true
          # Liveness only proves the process answers. Readiness additionally
          # checks PostgreSQL, so a database outage removes the pod from the
          # Service instead of restarting it.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
