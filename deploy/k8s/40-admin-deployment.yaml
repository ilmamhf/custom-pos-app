apiVersion: apps/v1
kind: Deployment
metadata:
  name: pos-admin
  namespace: pos
  labels:
    app.kubernetes.io/name: pos-admin
    app.kubernetes.io/component: admin
    app.kubernetes.io/part-of: pos
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pos-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pos-admin
        app.kubernetes.io/component: admin
        app.kubernetes.io/part-of: pos
    spec:
      securityContext:
        # The unprivileged nginx image already runs as UID 101.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          image: ghcr.io/example/pos-admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # nginx writes its pid file and the proxy temporary paths under /tmp,
          # so the root filesystem stays read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
