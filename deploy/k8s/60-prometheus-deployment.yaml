apiVersion: apps/v1
kind: Deployment
metadata:
  name: pos-prometheus
  namespace: pos
  labels:
    app.kubernetes.io/name: pos-prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: pos
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pos-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pos-prometheus
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: pos
      annotations:
        # The alert rules and the scrape configuration live in
        # deploy/monitoring/. Change them there and restart the pods.
        prometheus.io/scrape: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            # Prometheus writes its time series database here, so the root
            # filesystem can stay read-only.
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        # Created from deploy/monitoring/ with:
        #   kubectl create configmap pos-prometheus-config -n pos \
        #     --from-file=prometheus.yml=deploy/monitoring/prometheus.yml \
        #     --from-file=prometheus-rules.yaml=deploy/monitoring/prometheus-rules.yaml
        #
        # The `items` mapping puts the rule file under `rules/`, which is the
        # path `rule_files` in prometheus.yml points at.
        - name: config
          configMap:
            name: pos-prometheus-config
            items:
              - key: prometheus.yml
                path: prometheus.yml
              - key: prometheus-rules.yaml
                path: rules/prometheus-rules.yaml
        - name: data
          emptyDir: {}
