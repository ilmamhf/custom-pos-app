apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: pos
  labels:
    app.kubernetes.io/name: pos-prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: pos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pos-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
