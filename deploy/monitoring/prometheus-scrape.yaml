# Prometheus scrape jobs for the POS stack.
#
# This file holds the scrape configuration only. It is a reference for
# operators who merge the jobs into an existing Prometheus; the standalone
# `prometheus.yml` in this directory contains the same jobs plus the global
# and rule settings.
#
# The API exposes its registry at `/metrics`, outside the `/api/v1` prefix.
# The target name matches the Kubernetes Service (`api`) and the Compose
# service alias, so the same configuration works in both environments.

scrape_configs:
  # The API itself.
  - job_name: pos-api
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - api:3000
        labels:
          service: pos-api
          env: production
    # Uncomment when `METRICS_AUTH_TOKEN` is set on the API. Keep the token
    # in a mounted secret, never in this file.
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/secrets/pos-metrics-token

  # The textfile collector of node_exporter publishes the metrics of the
  # cron jobs, currently the age of the newest database backup.
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node-exporter

  # Prometheus' own metrics, so the dashboard can show the scrape health.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
